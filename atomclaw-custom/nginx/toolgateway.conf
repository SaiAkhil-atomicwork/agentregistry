# nginx vhost for toolgateway.atomicwork.in
#
# The agentgateway admin UI ships inside the upstream Go binary (we don't own
# the source), so we rebrand it via on-the-fly response rewrites:
#   - Swap visible "agentgateway" -> "toolgateway" in HTML/JS
#   - Override browser-tab favicon via injected <link>
#   - Capitalize the <title> to "ToolGateway Dashboard"
#   - Replace the React-rendered sidebar logo SVG with our atom icon via a
#     tiny JS shim watching for [data-sidebar="header"] (shadcn-ui pattern)
#
# Static atom icon is served from /atomclaw/ which maps to /var/www/atomclaw/.
#
# Place this file at /etc/nginx/sites-available/atomclaw-toolgateway
# Then symlink into /etc/nginx/sites-enabled/ and reload nginx.

server {
    listen 80;
    server_name toolgateway.atomicwork.in;

    # Serve our static atom favicon at /atomclaw-favicon.svg (overrides what the
    # upstream binary serves at /favicon.ico via the <link> we inject below).
    location = /atomclaw-favicon.svg {
        alias /var/www/atomclaw/atom-icon.svg;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:15000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Disable upstream gzip so sub_filter can rewrite responses
        proxy_set_header Accept-Encoding "";

        # text/html is the implicit default — extend to JS + JSON too
        sub_filter_types application/javascript application/json text/javascript;
        sub_filter_once off;

        # Capitalize the tab title FIRST (must run before the lowercase swap below)
        sub_filter '<title>agentgateway Dashboard</title>' '<title>ToolGateway Dashboard</title>';
        sub_filter 'content="agentgateway Dashboard"' 'content="ToolGateway Dashboard"';

        # Visible wordmark in the sidebar + everywhere else
        sub_filter 'agentgateway' 'toolgateway';
        sub_filter 'Agentgateway' 'Toolgateway';
        sub_filter 'AgentGateway' 'ToolGateway';

        # Inject favicon + persistent rebrand script.
        #
        # Two problems this solves:
        #   1. Sidebar logo: rendered by React; if we swap the SVG once and
        #      disconnect, a later re-render restores the upstream icon.
        #      Solution: persistent MutationObserver (idempotent swap, never
        #      disconnects).
        #   2. Tab title: React updates document.title on route changes,
        #      overwriting our static HTML rewrite. Solution: hijack the
        #      document.title setter to rewrite every assignment.
        sub_filter '</head>' '<link rel="icon" type="image/svg+xml" href="/atomclaw-favicon.svg" /><script>(function(){try{var d=Object.getOwnPropertyDescriptor(Document.prototype,"title");if(d&&d.set){Object.defineProperty(document,"title",{configurable:true,get:function(){return d.get.call(document)},set:function(v){if(typeof v==="string"){v=v.replace(/(agentgateway|toolgateway)/gi,"ToolGateway")}d.set.call(document,v)}});document.title=document.title}}catch(e){}function swap(){var h=document.querySelector(\'[data-sidebar="header"]\');if(!h)return;var v=h.querySelector(\'svg:not([data-atomclaw-keep])\');if(!v)return;var i=document.createElement("img");i.src="/atomclaw-favicon.svg";i.alt="ToolGateway";i.setAttribute("data-atomclaw-keep","1");i.style.cssText="width:40px;height:40px;border-radius:8px;flex-shrink:0";v.parentNode.replaceChild(i,v)}swap();new MutationObserver(swap).observe(document.documentElement,{childList:true,subtree:true})})();</script></head>';
    }
}
