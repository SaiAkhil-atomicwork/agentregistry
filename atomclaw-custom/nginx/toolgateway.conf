# nginx vhost for toolgateway.atomicwork.in
#
# The agentgateway admin UI ships inside the upstream Go binary (we don't own
# the source), so we rebrand it via on-the-fly response rewrites:
#   - Swap visible "agentgateway" -> "toolgateway" in HTML/JS
#   - Override browser-tab favicon via injected <link>
#   - Capitalize the <title> to "ToolGateway Dashboard"
#   - Replace the React-rendered sidebar logo SVG with our atom icon via a
#     tiny JS shim watching for [data-sidebar="header"] (shadcn-ui pattern)
#
# Static atom icon is served from /atomclaw/ which maps to /var/www/atomclaw/.
#
# Place this file at /etc/nginx/sites-available/atomclaw-toolgateway
# Then symlink into /etc/nginx/sites-enabled/ and reload nginx.

server {
    listen 80;
    server_name toolgateway.atomicwork.in gateway.atomicwork.in;

    # Serve our static atom favicon at /atomclaw-favicon.svg (overrides what the
    # upstream binary serves at /favicon.ico via the <link> we inject below).
    location = /atomclaw-favicon.svg {
        alias /var/www/atomclaw/atom-icon.svg;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:15000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Disable upstream gzip so sub_filter can rewrite responses
        proxy_set_header Accept-Encoding "";

        # text/html is the implicit default — extend to JS + JSON too
        sub_filter_types application/javascript application/json text/javascript;
        sub_filter_once off;

        # Capitalize the tab title FIRST (must run before the lowercase swap below)
        sub_filter '<title>agentgateway Dashboard</title>' '<title>ToolGateway Dashboard</title>';
        sub_filter 'content="agentgateway Dashboard"' 'content="ToolGateway Dashboard"';

        # Visible wordmark in the sidebar + everywhere else
        sub_filter 'agentgateway' 'toolgateway';
        sub_filter 'Agentgateway' 'Toolgateway';
        sub_filter 'AgentGateway' 'ToolGateway';

        # Inject persistent rebrand script.
        #
        # The agentgateway UI is a Next.js App Router SPA. On client-side
        # route changes React (1) writes the new title directly into the
        # <title> element textContent (NOT via document.title setter), and
        # (2) inserts per-route <link rel="icon"> elements. So a static
        # HTML <link> injection or a document.title setter hijack are both
        # bypassed within a few seconds of opening the app.
        #
        # The robust fix is three persistent MutationObservers:
        #   - <head>: rewrite <title> textContent + override foreign favicon
        #     hrefs whenever they appear or change
        #   - <body>: re-swap the sidebar SVG whenever React re-renders it
        # All three callbacks are idempotent (data-atomclaw-keep flag stops
        # the loops from triggering themselves).
        sub_filter '</head>' '<link rel="icon" type="image/svg+xml" href="/atomclaw-favicon.svg" data-atomclaw-keep="1" /><script>(function(){function fixTitle(){var t=document.querySelector("title");if(!t)return;var c=t.textContent||"";if(!/(?:agent|tool)gateway/i.test(c))return;var n=c.replace(/(?:agent|tool)gateway/gi,"ToolGateway");if(n!==c)t.textContent=n}function fixFavicons(){var ls=document.head.querySelectorAll(\'link[rel*="icon"]\');var ours=null;for(var k=0;k<ls.length;k++){var l=ls[k];if(l.getAttribute("data-atomclaw-keep")){ours=l;continue}if(l.getAttribute("href")!=="/atomclaw-favicon.svg"){l.setAttribute("href","/atomclaw-favicon.svg");l.setAttribute("type","image/svg+xml")}}if(!ours){var nl=document.createElement("link");nl.rel="icon";nl.type="image/svg+xml";nl.href="/atomclaw-favicon.svg";nl.setAttribute("data-atomclaw-keep","1");document.head.appendChild(nl)}}function fixSidebar(){var h=document.querySelector(\'[data-sidebar="header"]\');if(!h)return;var v=h.querySelector(\'svg:not([data-atomclaw-keep])\');if(!v)return;var i=document.createElement("img");i.src="/atomclaw-favicon.svg";i.alt="ToolGateway";i.setAttribute("data-atomclaw-keep","1");i.style.cssText="width:40px;height:40px;border-radius:8px;flex-shrink:0";v.parentNode.replaceChild(i,v)}function tickHead(){fixTitle();fixFavicons()}tickHead();fixSidebar();new MutationObserver(tickHead).observe(document.head,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["href"]});new MutationObserver(fixSidebar).observe(document.body||document.documentElement,{childList:true,subtree:true})})();</script></head>';
    }
}
